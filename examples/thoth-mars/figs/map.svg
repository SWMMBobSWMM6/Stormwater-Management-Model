<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-label="Map of the Thoth canal system" style="font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="760" height="480" fill="#ffffff"/><text x="24" y="30" font-size="16" fill="#1f2937" font-weight="700">The Thoth, from the Headworks to Colony Basin</text><text x="24" y="50" font-size="13" fill="#4b5563">Schematic, not to scale. Mileposts from the Headworks.</text><rect x="0" y="64" width="760" height="416" fill="#fbf6f0"/><line x1="70" y1="120" x2="560" y2="120" stroke="#2563eb" stroke-width="9"/><line x1="70" y1="120" x2="560" y2="120" stroke="#dbeafe" stroke-width="3"/><circle cx="70" cy="120" r="9" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="60" y="100" font-size="13" fill="#1f2937" font-weight="600">Headworks</text><text x="70" y="146" font-size="11.5" fill="#4b5563" text-anchor="middle">thaw water in</text><line x1="131.25" y1="112" x2="131.25" y2="128" stroke="#1f2937" stroke-width="1.2"/><text x="131.25" y="146" font-size="11.5" fill="#6b7280" text-anchor="middle">mile 1</text><line x1="192.5" y1="112" x2="192.5" y2="128" stroke="#1f2937" stroke-width="1.2"/><text x="192.5" y="146" font-size="11.5" fill="#6b7280" text-anchor="middle">mile 2</text><line x1="253.75" y1="112" x2="253.75" y2="128" stroke="#1f2937" stroke-width="1.2"/><line x1="315" y1="112" x2="315" y2="128" stroke="#1f2937" stroke-width="1.2"/><line x1="376.25" y1="112" x2="376.25" y2="128" stroke="#1f2937" stroke-width="1.2"/><line x1="437.5" y1="112" x2="437.5" y2="128" stroke="#1f2937" stroke-width="1.2"/><text x="437.5" y="146" font-size="11.5" fill="#6b7280" text-anchor="middle">mile 6</text><line x1="498.75" y1="112" x2="498.75" y2="128" stroke="#1f2937" stroke-width="1.2"/><line x1="560" y1="112" x2="560" y2="128" stroke="#1f2937" stroke-width="1.2"/><text x="223.13" y="104" font-size="12" fill="#4b5563" text-anchor="middle">Upper Thoth, 8 miles</text><rect x="311" y="94" width="8" height="52" fill="#8c5634"/><text x="327" y="88" font-size="13" fill="#1f2937" font-weight="600">Causeway Culvert at mile 4</text><text x="327" y="103" font-size="11.5" fill="#4b5563">10 ft long, under the road</text><path d="M560,120L610,210" stroke="#2563eb" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="624" y="158" font-size="13" fill="#1f2937" font-weight="600">the Chute</text><text x="624" y="173" font-size="11.5" fill="#4b5563">400 ft down the</text><text x="624" y="187" font-size="11.5" fill="#4b5563">escarpment, 20-ft drop</text><line x1="610" y1="210" x2="200" y2="210" stroke="#2563eb" stroke-width="9"/><line x1="610" y1="210" x2="200" y2="210" stroke="#dbeafe" stroke-width="3"/><line x1="541.67" y1="202" x2="541.67" y2="218" stroke="#1f2937" stroke-width="1.2"/><line x1="473.33" y1="202" x2="473.33" y2="218" stroke="#1f2937" stroke-width="1.2"/><line x1="405" y1="202" x2="405" y2="218" stroke="#1f2937" stroke-width="1.2"/><line x1="336.67" y1="202" x2="336.67" y2="218" stroke="#1f2937" stroke-width="1.2"/><line x1="268.33" y1="202" x2="268.33" y2="218" stroke="#1f2937" stroke-width="1.2"/><line x1="200" y1="202" x2="200" y2="218" stroke="#1f2937" stroke-width="1.2"/><text x="435" y="194" font-size="12" fill="#4b5563" text-anchor="middle">Lower Thoth: 6 miles</text><rect x="178" y="202" width="14" height="16" fill="#c2410c"/><path d="M178,210L120,244L40,290" stroke="#c2410c" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><text x="24" y="314" font-size="12" fill="#c2410c">the Old Canal (dry),</text><text x="24" y="329" font-size="12" fill="#c2410c">west to the desert</text><text x="170" y="180" font-size="13" fill="#1f2937" text-anchor="end" font-weight="600">Old Canal gate</text><text x="170" y="196" font-size="11.5" fill="#4b5563" text-anchor="end">8 x 20 ft, hand-cranked</text><path d="M200,210L240,250L290,294" stroke="#2563eb" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="360" cy="340" rx="140" ry="50" fill="#bfdbfe" stroke="#d6a77a" stroke-width="8"/><rect x="284" y="288" width="11" height="11" fill="#7c3aed"/><text x="302" y="278" font-size="11.5" fill="#4b5563">the Lock and its 10-ft gate throat</text><text x="360" y="338" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Colony Basin</text><text x="360" y="356" font-size="12" fill="#4b5563" text-anchor="middle">34 acres, levee crest 14.5 ft</text><path d="M480,314L560,280L700,272" stroke="#15803d" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="740" y="262" font-size="12" fill="#15803d" text-anchor="end">town intake, 150 cfs, to Thoth Landing</text><path d="M498,348L580,372L740,378" stroke="#2563eb" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="740" y="366" font-size="12" fill="#4b5563" text-anchor="end">Outlet Canal to the Sink</text><text x="520" y="400" font-size="11.5" fill="#4b5563">overflow sill: 100 ft long, crest 8 ft</text><path d="M285,438 a11,11 0 0 1 22,0 z" fill="#e8eef3" stroke="#9fb3c4"/><path d="M311,438 a11,11 0 0 1 22,0 z" fill="#e8eef3" stroke="#9fb3c4"/><path d="M337,438 a11,11 0 0 1 22,0 z" fill="#e8eef3" stroke="#9fb3c4"/><path d="M363,438 a11,11 0 0 1 22,0 z" fill="#e8eef3" stroke="#9fb3c4"/><path d="M389,438 a11,11 0 0 1 22,0 z" fill="#e8eef3" stroke="#9fb3c4"/><path d="M415,438 a11,11 0 0 1 22,0 z" fill="#e8eef3" stroke="#9fb3c4"/><text x="360" y="458" font-size="12" fill="#b91c1c" text-anchor="middle">Lower Town greenhouses, below the levee</text><line x1="730" y1="130" x2="730" y2="92" stroke="#1f2937" stroke-width="2"/><path d="M724,100 L730,86 L736,100 z" fill="#1f2937"/><text x="730" y="146" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="700">N</text></svg>