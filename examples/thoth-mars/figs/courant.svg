<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Courant time of each conduit" style="font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="760" height="400" fill="#ffffff"/><text x="24" y="30" font-size="16" fill="#1f2937" font-weight="700">Two ten-foot openings set the clock for fifteen miles</text><text x="24" y="50" font-size="13" fill="#4b5563">Each conduit's tightest Courant time in the Company model: 0.75 L / (v + c), seconds.</text><rect x="230" y="70" width="470" height="256" fill="#fcfcfd"/><line x1="230" y1="70" x2="230" y2="326" stroke="#e5e7eb" stroke-width="1"/><text x="230" y="343" font-size="12" fill="#6b7280" text-anchor="middle">0.1</text><line x1="347.5" y1="70" x2="347.5" y2="326" stroke="#e5e7eb" stroke-width="1"/><text x="347.5" y="343" font-size="12" fill="#6b7280" text-anchor="middle">1</text><line x1="465" y1="70" x2="465" y2="326" stroke="#e5e7eb" stroke-width="1"/><text x="465" y="343" font-size="12" fill="#6b7280" text-anchor="middle">10</text><line x1="582.5" y1="70" x2="582.5" y2="326" stroke="#e5e7eb" stroke-width="1"/><text x="582.5" y="343" font-size="12" fill="#6b7280" text-anchor="middle">100</text><line x1="700" y1="70" x2="700" y2="326" stroke="#e5e7eb" stroke-width="1"/><text x="700" y="343" font-size="12" fill="#6b7280" text-anchor="middle">1,000</text><rect x="230" y="70" width="470" height="256" fill="none" stroke="#cbd5e1" stroke-width="1"/><rect x="230" y="77.29" width="23.66" height="22" fill="#c2410c"/><text x="222" y="92.29" font-size="13" fill="#1f2937" text-anchor="end">gate throat (10 ft)</text><text x="259.66" y="92.29" font-size="13" fill="#1f2937">0.16 s</text><rect x="230" y="113.86" width="49.54" height="22" fill="#c2410c"/><text x="222" y="128.86" font-size="13" fill="#1f2937" text-anchor="end">causeway culvert (10 ft)</text><text x="285.54" y="128.86" font-size="13" fill="#1f2937">0.26 s</text><rect x="230" y="150.43" width="227.52" height="22" fill="#2563eb"/><text x="222" y="165.43" font-size="13" fill="#1f2937" text-anchor="end">intake channel (300 ft)</text><text x="463.52" y="165.43" font-size="13" fill="#1f2937">8.6 s</text><rect x="230" y="187" width="233.46" height="22" fill="#2563eb"/><text x="222" y="202" font-size="13" fill="#1f2937" text-anchor="end">the Chute (400 ft)</text><text x="469.46" y="202" font-size="13" fill="#1f2937">9.7 s</text><rect x="230" y="223.57" width="269.84" height="22" fill="#2563eb"/><text x="222" y="238.57" font-size="13" fill="#1f2937" text-anchor="end">last reach to basin (600 ft)</text><text x="505.84" y="238.57" font-size="13" fill="#1f2937">19.8 s</text><rect x="230" y="260.14" width="364.51" height="22" fill="#2563eb"/><text x="222" y="275.14" font-size="13" fill="#1f2937" text-anchor="end">outlet canal</text><text x="600.51" y="275.14" font-size="13" fill="#1f2937">126.5 s</text><rect x="230" y="296.71" width="371.2" height="22" fill="#2563eb"/><text x="222" y="311.71" font-size="13" fill="#1f2937" text-anchor="end">the other 14 reaches (1 mile)</text><text x="607.2" y="311.71" font-size="13" fill="#1f2937">144.3 s</text><line x1="521.06" y1="70" x2="521.06" y2="326" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/><text x="527.06" y="84" font-size="12" fill="#4b5563">routing step allowed: 30 s</text><text x="465" y="364" font-size="13" fill="#4b5563" text-anchor="middle">seconds (log scale)</text><text x="230" y="390" font-size="13" fill="#1f2937">Average step the Company run actually took: 0.27 s.</text></svg>