<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Canal cross-section with two water levels" style="font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="760" height="330" fill="#ffffff"/><text x="24" y="30" font-size="16" fill="#1f2937" font-weight="700">Same canal, same flood, two answers</text><text x="24" y="50" font-size="13" fill="#4b5563">The Upper Thoth at mile 1 at the crest of the thaw: 4,200 cfs.</text><path d="M163.4,93.93 L288,270 L472,270 L596.6,93.93 z" fill="#bfdbfe"/><path d="M191.11,133.1L568.89,133.1" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M163.4,93.93L596.6,93.93" stroke="#c2410c" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M94.8,88L159.2,88L288,270L472,270L600.8,88L665.2,88 L665.2,296 L94.8,296 z" fill="#e7c8a8" fill-opacity="0.65" stroke="#b45309" stroke-width="2"/><path d="M287.99,269.99 L288,270 L472,270 L472.01,269.99 z" fill="#bfdbfe"/><text x="618.8" y="82" font-size="13" fill="#1f2937">bank top, 14.0 ft</text><text x="380" y="113.93" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="600">Mars constants: 13.54 ft, half a foot below the bank top</text><text x="380" y="153.1" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="600">Company model (Earth constants): 10.53 ft</text><text x="380" y="288" font-size="12" fill="#4b5563" text-anchor="middle">40-ft bed, sides 2 to 1, lined; slope 1.6 ft per mile</text></svg>