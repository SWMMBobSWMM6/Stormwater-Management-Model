<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Run times of the canal model" style="font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="760" height="330" fill="#ffffff"/><text x="24" y="30" font-size="16" fill="#1f2937" font-weight="700">Nothing is free: four cells cost more than they saved</text><text x="24" y="50" font-size="13" fill="#4b5563">Wall time of one 4-day run, median of interleaved runs on a modern machine. The Clerk was 1,000 times slower.</text><rect x="290" y="70" width="320" height="208" fill="#fcfcfd"/><line x1="290" y1="70" x2="290" y2="278" stroke="#e5e7eb" stroke-width="1"/><text x="290" y="295" font-size="12" fill="#6b7280" text-anchor="middle">0</text><line x1="370" y1="70" x2="370" y2="278" stroke="#e5e7eb" stroke-width="1"/><text x="370" y="295" font-size="12" fill="#6b7280" text-anchor="middle">4</text><line x1="450" y1="70" x2="450" y2="278" stroke="#e5e7eb" stroke-width="1"/><text x="450" y="295" font-size="12" fill="#6b7280" text-anchor="middle">8</text><line x1="530" y1="70" x2="530" y2="278" stroke="#e5e7eb" stroke-width="1"/><text x="530" y="295" font-size="12" fill="#6b7280" text-anchor="middle">12</text><line x1="610" y1="70" x2="610" y2="278" stroke="#e5e7eb" stroke-width="1"/><text x="610" y="295" font-size="12" fill="#6b7280" text-anchor="middle">16</text><rect x="290" y="70" width="320" height="208" fill="none" stroke="#cbd5e1" stroke-width="1"/><rect x="290" y="83" width="276.8" height="26" fill="#6b7280"/><text x="282" y="100" font-size="13" fill="#1f2937" text-anchor="end">Company model (Earth, throat and culvert)</text><text x="572.8" y="100" font-size="13" fill="#1f2937" font-weight="600">13.84 s</text><text x="630.8" y="100" font-size="12.5" fill="#4b5563">Clerk: 3 h 51 min</text><rect x="290" y="135" width="129.3" height="26" fill="#2563eb"/><text x="282" y="152" font-size="13" fill="#1f2937" text-anchor="end">Mars model, stock dynamic wave</text><text x="425.3" y="152" font-size="13" fill="#1f2937" font-weight="600">6.47 s</text><text x="483.3" y="152" font-size="12.5" fill="#4b5563">Clerk: 1 h 48 min</text><rect x="290" y="187" width="188.09" height="26" fill="#7c3aed"/><text x="282" y="204" font-size="13" fill="#1f2937" text-anchor="end">Mars model, culvert as FV, 4 cells</text><text x="484.09" y="204" font-size="13" fill="#1f2937" font-weight="600">9.40 s</text><text x="542.09" y="204" font-size="12.5" fill="#4b5563">Clerk: 2 h 37 min</text><rect x="290" y="239" width="28.06" height="26" fill="#c2410c"/><text x="282" y="256" font-size="13" fill="#1f2937" text-anchor="end">Mars model, culvert as FV, 1 cell</text><text x="324.06" y="256" font-size="13" fill="#1f2937" font-weight="600">1.40 s</text><text x="382.06" y="256" font-size="12.5" fill="#4b5563">Clerk: 23 min</text><text x="450" y="316" font-size="13" fill="#4b5563" text-anchor="middle">seconds on a modern machine</text></svg>