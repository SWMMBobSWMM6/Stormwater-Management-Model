<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Stock conduit versus finite-volume cells" style="font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="760" height="470" fill="#ffffff"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1f2937"/></marker></defs><text x="24" y="30" font-size="16" fill="#1f2937" font-weight="700">How the hybrid engine handles the culvert</text><text x="24" y="50" font-size="13" fill="#4b5563">Diagram, not a run. Step sizes are the averages from the Mars runs.</text><text x="24" y="92" font-size="14" fill="#2563eb" font-weight="700">Stock dynamic wave: one conduit, and its clock rules all fifteen miles</text><line x1="70" y1="140" x2="250" y2="140" stroke="#2563eb" stroke-width="8"/><line x1="510" y1="140" x2="690" y2="140" stroke="#2563eb" stroke-width="8"/><rect x="300" y="122" width="160" height="36" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="380" y="145" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="600">CULVERT, 10 ft</text><line x1="263" y1="140" x2="300" y2="140" stroke="#2563eb" stroke-width="4"/><line x1="460" y1="140" x2="497" y2="140" stroke="#2563eb" stroke-width="4"/><circle cx="250" cy="140" r="13" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="250" y="172" font-size="12" fill="#4b5563" text-anchor="middle">U4</text><circle cx="510" cy="140" r="13" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="510" y="172" font-size="12" fill="#4b5563" text-anchor="middle">U4X</text><text x="70" y="126" font-size="12" fill="#4b5563">a mile of canal</text><text x="690" y="126" font-size="12" fill="#4b5563" text-anchor="end">a mile of canal</text><text x="380" y="196" font-size="13" fill="#1f2937" text-anchor="middle">Every node and conduit advances together: 0.59 s on average, set by the 10-ft culvert.</text><line x1="24" y1="222" x2="736" y2="222" stroke="#e5e7eb" stroke-width="1"/><text x="24" y="254" font-size="14" fill="#c2410c" font-weight="700">Hybrid: the culvert becomes cells with their own fast clock</text><line x1="70" y1="318" x2="250" y2="318" stroke="#2563eb" stroke-width="8"/><line x1="510" y1="318" x2="690" y2="318" stroke="#2563eb" stroke-width="8"/><line x1="263" y1="318" x2="280" y2="318" stroke="#2563eb" stroke-width="4"/><line x1="480" y1="318" x2="497" y2="318" stroke="#2563eb" stroke-width="4"/><rect x="280" y="300" width="20" height="36" fill="#fde7d9" stroke="#c2410c" stroke-width="1.5"/><rect x="460" y="300" width="20" height="36" fill="#fde7d9" stroke="#c2410c" stroke-width="1.5"/><rect x="300" y="300" width="40" height="36" fill="#bfdbfe" stroke="#c2410c" stroke-width="2"/><rect x="340" y="300" width="40" height="36" fill="#bfdbfe" stroke="#c2410c" stroke-width="2"/><rect x="380" y="300" width="40" height="36" fill="#bfdbfe" stroke="#c2410c" stroke-width="2"/><rect x="420" y="300" width="40" height="36" fill="#bfdbfe" stroke="#c2410c" stroke-width="2"/><line x1="300" y1="288" x2="300" y2="298" stroke="#c2410c" stroke-width="2"/><line x1="340" y1="288" x2="340" y2="298" stroke="#c2410c" stroke-width="2"/><line x1="380" y1="288" x2="380" y2="298" stroke="#c2410c" stroke-width="2"/><line x1="420" y1="288" x2="420" y2="298" stroke="#c2410c" stroke-width="2"/><line x1="460" y1="288" x2="460" y2="298" stroke="#c2410c" stroke-width="2"/><circle cx="250" cy="318" r="13" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="250" y="350" font-size="12" fill="#4b5563" text-anchor="middle">U4</text><circle cx="510" cy="318" r="13" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="510" y="350" font-size="12" fill="#4b5563" text-anchor="middle">U4X</text><text x="380" y="280" font-size="12" fill="#c2410c" text-anchor="middle">faces: a Riemann flux at each</text><text x="290" y="358" font-size="11.5" fill="#c2410c" text-anchor="middle">ghost</text><text x="470" y="358" font-size="11.5" fill="#c2410c" text-anchor="middle">ghost</text><text x="380" y="358" font-size="12" fill="#4b5563" text-anchor="middle">cells (here 4)</text><text x="380" y="396" font-size="13" fill="#1f2937" text-anchor="middle">The network steps 16.3 s on average. Inside each step the culvert runs 84 substeps with 1 cell,</text><text x="380" y="414" font-size="13" fill="#1f2937" text-anchor="middle">or 335 with 4 (all solver passes counted), then hands its flow back to U4 and U4X.</text><text x="380" y="446" font-size="12.5" fill="#4b5563" text-anchor="middle">A ghost cell borrows the node's water level. The engine as built also gave it the first cell's</text><text x="380" y="463" font-size="12.5" fill="#4b5563" text-anchor="middle">velocity, and that pairing put energy into the water that was never there.</text></svg>